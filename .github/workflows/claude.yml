name: Claude Code

# Lets @claude be invoked from issues/PRs to make changes via Claude Code, running inside GitHub
# Actions. Independent of the CI (build/test) and CD (build/push/deploy) workflows in this same
# directory. Requires a repository secret with Claude Code's credentials — see the note below.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude-code-action:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
        with:
          # Add ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN, depending on how you authenticate)
          # under Settings → Secrets and variables → Actions in this repository. Never commit the
          # value itself here.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
